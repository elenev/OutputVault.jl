name: CI
on:
  pull_request:
    branches: [main]
  # Pushes to main that change code give pull requests a cache to start from and Codecov a base
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'ext/**'
      - 'test/**'
      - 'sql/**'
      - 'docs/walkthroughs.jl'
      - 'README.md'                      # the tests run the examples of these pages
      - 'docs/src/index.md'
      - 'docs/src/guide/quickstart.md'
      - 'docs/src/guide/frontends.md'
      - 'docs/src/guide/tables.md'
      - 'Project.toml'
      - '.github/workflows/CI.yml'
# actions: write lets the cache step delete the caches it replaces
permissions:
  contents: read
  actions: write
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1'   # Latest stable release
          - 'min' # Lowest Julia version allowed by [compat]
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        exclude:
          # Oldest supported Julia only on Linux; the slow platforms test the latest release
          - {version: 'min', os: windows-latest}
          - {version: 'min', os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
